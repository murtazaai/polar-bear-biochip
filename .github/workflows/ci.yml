# ══════════════════════════════════════════════════════════════════════════════
#  polar-bear-biochip · GitHub Actions CI
#  Rust 2024 · MSRV 1.85.0 · rig-core 0.37 · dual feature matrix
#
#  Jobs (in order):
#    fmt      – cargo fmt --check
#    clippy   – cargo clippy -D warnings (default + ai-agent feature)
#    build    – cargo build --release (default + ai-agent feature)
#    test     – cargo test SKIP_LLM=1 (default + ai-agent feature)
#    doc      – cargo doc --no-deps  RUSTDOCFLAGS="-D warnings"
#    msrv     – build + test on rust-version = 1.85.0
#    publish  – cargo publish --dry-run (on tag push only)
# ══════════════════════════════════════════════════════════════════════════════

name: CI

on:
    push:
        branches: ["main", "master"]
        tags: ["v*"]
    pull_request:
        branches: ["main", "master"]

env:
    CARGO_TERM_COLOR: always
    CARGO_INCREMENTAL: 0 # Faster in CI; no persistent cache corruption
    RUST_BACKTRACE: 1

# Cancel any in-progress run on the same branch when a new push arrives.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ────────────────────────────────────────────────────────────────────────────
    # 1. Formatting gate — must pass before anything else runs
    # ────────────────────────────────────────────────────────────────────────────
    fmt:
        name: fmt
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install nightly toolchain + rustfmt
              uses: dtolnay/rust-toolchain@nightly
              with:
                  components: rustfmt

            - name: cargo fmt --check
              run: cargo fmt --all -- --check

    # ────────────────────────────────────────────────────────────────────────────
    # 2. Clippy — run against both feature sets
    # ────────────────────────────────────────────────────────────────────────────
    clippy:
        name: clippy (${{ matrix.features }})
        runs-on: ubuntu-latest
        needs: fmt
        strategy:
            fail-fast: false
            matrix:
                features:
                    - "" # default features (curl fallback agent)
                    - "ai-agent" # rig-core backend
        steps:
            - uses: actions/checkout@v4

            - name: Install stable toolchain + clippy
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  key: clippy-${{ matrix.features }}

            - name: cargo clippy (no features)
              if: matrix.features == ''
              run: cargo clippy --all-targets -- -D warnings

            - name: cargo clippy (ai-agent)
              if: matrix.features == 'ai-agent'
              run: cargo clippy --all-targets --features ai-agent -- -D warnings

    # ────────────────────────────────────────────────────────────────────────────
    # 3. Build — release profile, both feature sets
    # ────────────────────────────────────────────────────────────────────────────
    build:
        name: build (${{ matrix.features || 'default' }})
        runs-on: ubuntu-latest
        needs: clippy
        strategy:
            fail-fast: false
            matrix:
                features:
                    - ""
                    - "ai-agent"
        steps:
            - uses: actions/checkout@v4

            - name: Install stable toolchain
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: build-${{ matrix.features }}

            - name: cargo build --release (no features)
              if: matrix.features == ''
              run: cargo build --release

            - name: cargo build --release (ai-agent)
              if: matrix.features == 'ai-agent'
              run: cargo build --release --features ai-agent

    # ────────────────────────────────────────────────────────────────────────────
    # 4. Test — SKIP_LLM=1 so no API key is required; both feature sets
    # ────────────────────────────────────────────────────────────────────────────
    test:
        name: test (${{ matrix.features || 'default' }})
        runs-on: ubuntu-latest
        needs: build
        strategy:
            fail-fast: false
            matrix:
                features:
                    - ""
                    - "ai-agent"
        steps:
            - uses: actions/checkout@v4

            - name: Install stable toolchain
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: test-${{ matrix.features }}

            # SKIP_LLM=1 → demo mode; no ANTHROPIC_API_KEY needed in CI.
            # Never pass --skip-llm as a cargo test arg — the test harness
            # rejects unknown flags after `--`. Always use env vars.
            - name: cargo test (no features)
              if: matrix.features == ''
              run: SKIP_LLM=1 cargo test -- --nocapture

            - name: cargo test (ai-agent)
              if: matrix.features == 'ai-agent'
              run: SKIP_LLM=1 cargo test --features ai-agent -- --nocapture

    # ────────────────────────────────────────────────────────────────────────────
    # 5. Docs — with --cfg docsrs to match docs.rs environment
    # ────────────────────────────────────────────────────────────────────────────
    doc:
        name: doc
        runs-on: ubuntu-latest
        needs: test
        steps:
            - uses: actions/checkout@v4

            - name: Install stable toolchain
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: doc

            - name: cargo doc --no-deps (all features, docsrs cfg)
              env:
                  RUSTDOCFLAGS: "--cfg docsrs -D warnings"
              run: cargo doc --no-deps --all-features

    # ────────────────────────────────────────────────────────────────────────────
    # 6. MSRV — build + test on rust-version = 1.85.0 (Rust 2024 minimum)
    # ────────────────────────────────────────────────────────────────────────────
    msrv:
        name: msrv (1.85.0)
        runs-on: ubuntu-latest
        needs: fmt
        steps:
            - uses: actions/checkout@v4

            - name: Install MSRV toolchain (1.85.0)
              uses: dtolnay/rust-toolchain@1.85.0

            - uses: Swatinem/rust-cache@v2
              with:
                  key: msrv

            - name: cargo build on MSRV
              run: cargo build

            - name: cargo test on MSRV
              run: SKIP_LLM=1 cargo test

    # # ────────────────────────────────────────────────────────────────────────────
    # # 7. Publish dry-run — only on tag pushes (v*)
